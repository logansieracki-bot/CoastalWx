name: Deploy to GitHub Pages

# Mirrors the real (Railway) deployment's routing: the public read-only
# site at the root, the forecaster editor at /editor. Pages only serves
# static files -- no server, no database, no /api -- so both fall back
# gracefully: the public page shows clearly-labeled sample data (see its
# own demo-data fallback in public/src/main.js) and the editor falls back
# to browser localStorage (with its own honest banner). The earlier
# sample-data forecast page still gets published too, at /forecast/, so
# it isn't lost.

on:
  push:
    branches:
      - claude/vibrant-cannon-756pgb
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Stage site
        run: |
          mkdir -p _site/editor _site/forecast
          cp -r public/. _site/
          cp -r editor/. _site/editor/
          cp index.html _site/forecast/

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
