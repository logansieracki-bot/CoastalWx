name: Deploy to GitHub Pages

# Publishes the editor (map + toolbar + sidebar) at the site root -- it's
# what this project is actually building. It falls back to browser
# localStorage when no real backend is reachable (which is always true on
# Pages, since Pages only serves static files -- no server, no database).
# The earlier sample-data public forecast page still gets published too,
# just moved to /forecast/ so it isn't lost.

on:
  push:
    branches:
      - claude/vibrant-cannon-756pgb
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Stage site
        run: |
          mkdir -p _site/forecast
          cp -r editor/. _site/
          cp index.html _site/forecast/

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
