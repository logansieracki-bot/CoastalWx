<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tempest Coast</title>
<meta name="description" content="Live tracking for coastal lows and Nor'easters.">
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2032%2032'%3E%3Crect%20width='32'%20height='32'%20rx='8'%20fill='%230a1628'/%3E%3Cpath%20d='M5%2018c3-5%207-5%2010%200s7%205%2010%200%22%20stroke='%235eead4'%20stroke-width='2.4'%20fill='none'%20stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="shell">
  <div id="demo-banner" class="demo-banner" hidden>
    <strong>DEMO MODE</strong> — no live backend connected here, showing sample data. <a href="/editor">Forecaster sign-in</a>
  </div>

  <header class="hero">
    <div class="hero__brand">
      <span class="hero__mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="22" height="22"><path d="M2 14c3-5 7-5 10 0s7 5 10 0M2 19c3-5 7-5 10 0s7 5 10 0" stroke="currentColor" stroke-width="2.2" fill="none" stroke-linecap="round"/></svg>
      </span>
      <div>
        <h1>Tempest Coast</h1>
        <p>Live coastal storm &amp; Nor&rsquo;easter tracking</p>
      </div>
    </div>
    <p id="hero-status" class="hero__status"></p>
    <a class="hero__editor-link" href="/editor">Forecaster sign-in</a>
  </header>

  <div class="content">
    <aside class="system-list" id="system-list" aria-label="Active systems">
      <p id="system-list-empty" class="system-list__empty">No active disturbances or systems right now.</p>
    </aside>

    <main class="map-pane">
      <svg id="map"></svg>
      <p class="map-hint">Click a system on the map or in the list &middot; drag to pan &middot; scroll to zoom</p>
    </main>
  </div>
</div>
<script type="module" src="src/main.js"></script>
</body>
</html>
