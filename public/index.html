<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NorEASterCaster</title>
<meta name="description" content="Live tracking for coastal lows and Nor'easters.">
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2032%2032'%3E%3Ccircle%20cx='16'%20cy='16'%20r='15'%20fill='%230b1f3a'/%3E%3Ctext%20x='16'%20y='22'%20font-size='17'%20font-family='system-ui,sans-serif'%20font-weight='700'%20fill='%23ffffff'%20text-anchor='middle'%3EL%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app-shell">
  <header class="site-header">
    <div class="site-header__brand">
      <span class="site-header__mark">L</span>
      <div>
        <strong>NorEASterCaster</strong>
        <span>Live coastal storm tracking</span>
      </div>
    </div>
    <a class="site-header__editor-link" href="/editor">Forecaster login</a>
  </header>

  <main class="map-wrap" id="map-wrap">
    <svg id="map"></svg>

    <p id="map-hint" class="map-hint">Click a system for details &middot; drag to pan &middot; scroll to zoom</p>

    <div id="empty-state" class="empty-state">
      <strong>No active disturbances or systems</strong>
      <span>Check back for updates.</span>
    </div>

    <section id="info-panel" class="info-panel" hidden>
      <button id="info-close" class="info-panel__close" aria-label="Close">&times;</button>
      <h2 id="info-name"></h2>
      <p id="info-meta" class="info-panel__meta"></p>
      <div id="info-body"></div>
    </section>

    <div id="advisory-badge" class="advisory-badge" hidden>
      <span class="advisory-badge__label">Latest advisory</span>
      <span id="advisory-badge-time"></span>
    </div>
  </main>
</div>
<script type="module" src="src/main.js"></script>
</body>
</html>
